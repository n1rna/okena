[package]
name = "okena-views-extensions"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Native views for extensions run in the daemon: okena draws what each
# extension returns (tables, trees, charts, detail panes), runs its actions,
# and installs, updates and configures extensions from Settings.

[dependencies]
okena-core = { path = "../okena-core" }
okena-transport = { path = "../okena-transport", features = ["blocking-http"] }
okena-ui = { path = "../okena-ui" }
okena-workspace = { path = "../okena-workspace" }

gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }
lyon = "1.0"
smol = "2.0"
log = "0.4"
serde_json = "1.0"
